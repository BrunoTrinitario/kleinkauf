#nombre y puerto del servicio
spring.application.name=products-microservice
server.port=3002

#Loggin levels
logging.level.org.springframework.security=DEBUG
logging.level.com.decor.users.decorusers=DEBUG

#Path donde se guardaran las imagenes de los productos
image.path=uploads/products/images

#Configuracion de Redis
spring.redis.host=localhost
spring.redis.port=6379

#Path cargado para eureka asi se consulta los roles de usuarios
users.url = http://users-microservice/

#secreto para crear el jwt de microservicios
api.internal.key=secretomagico123supermegaseguro123

#Confgiracion de la master db en postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/products
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-circular-references=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.engine.jdbc.connections=DEBUG

#Configuracion eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true