/*
Libreria comun de los microservicios de decor.
- decor-common-core: lo que usan todos (gateway incluido): DTOs, headers, Redis, Caffeine y tokens internos.
- decor-common-servlet: lo que usan los servicios servlet (users, products): multi-tenant de Hibernate,
  filtro de tenant, excepciones y usuario autenticado.
Los servicios la consumen como build compuesto: includeBuild('../decor-common') en su settings.gradle.
 */
plugins {
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.decor'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.14'
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
	}
}

subprojects {
	dependencies {
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
