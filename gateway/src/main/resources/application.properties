#nombre y puerto del servicio
spring.application.name=gateway-microservice
server.port=3000

#Secreto para validar los JWT de clientes y para JWT de microservicios
jwt.secret=MiSuperSecretoUltraSeguro123456789
api.internal.key=secretomagico123supermegaseguro123

#Redirects usando eureka para hacer uso de los microservicios
tenant.url = lb://users-microservice/api/internal/tenants
users.url = lb://users-microservice
products.url = lb://products-microservice

#Configuracion de Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Configuracion de Eureka, ip, auto-registro, forzar a ip
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true