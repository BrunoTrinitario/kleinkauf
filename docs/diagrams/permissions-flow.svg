<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="How permissions reach each service">
<title>How permissions reach each service</title>
<style>
svg{--bg:#fafaf9;--card:#ffffff;--border:#d6d3d1;--ink:#1c1917;--muted:#78716c;--line:#a8a29e;--accent:#1677bd;--wash:#e8f2fa;--wash-border:#9cc6e6;--data:#f5f5f4;--paid:#e7f5ec;--paid-border:#8cc9a2;--final:#f1f0ef}
@media (prefers-color-scheme: dark){svg{--bg:#0f1419;--card:#1a2027;--border:#3a434d;--ink:#e6edf3;--muted:#9aa4af;--line:#5f6b77;--accent:#2b7fc4;--wash:#13283a;--wash-border:#2f5f88;--data:#1f262e;--paid:#14291d;--paid-border:#2f6b45;--final:#22282f}}
text{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--border);stroke-width:1}
.accent{fill:var(--accent);stroke:none}
.data{fill:var(--data);stroke:var(--border);stroke-width:1}
.client{fill:var(--wash);stroke:var(--wash-border);stroke-width:1}
.note{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.paid{fill:var(--paid);stroke:var(--paid-border);stroke-width:1}
.final{fill:var(--final);stroke:var(--muted);stroke-width:1.5}
.head{fill:var(--wash)}
.sep{stroke:var(--border);stroke-width:1}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:var(--muted)}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12px}
.mt{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12.5px;font-weight:600}
.r{font-size:12.5px}
.on-accent{fill:#ffffff}
.on-accent-s{fill:#dbeaf7;font-size:12px}
.lane{font-size:12px;font-weight:600;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.badge{fill:var(--accent)}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}
.l{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.lp{stroke:var(--card)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="960" height="560" rx="12"/>
<text x="30" y="36" class="lane" text-anchor="start">users</text>
<text x="930" y="36" class="lane" text-anchor="end">products and sales</text>
<line class="sep" x1="30" x2="330" y1="46" y2="46"/>
<line class="sep" x1="630" x2="930" y1="46" y2="46"/>
<rect class="data" x="30" y="66" width="300" height="50" rx="8"/>
<text x="180" y="88" class="mt" text-anchor="middle">role_permissions</text>
<text x="180" y="105" class="s" text-anchor="middle">per schema</text>
<path class="e" d="M180 116 L180 170" marker-end="url(#a)"/>
<text x="190" y="147" class="l" text-anchor="start">RolePermissionService.maskFor(role)</text>
<rect class="box" x="30" y="170" width="300" height="50" rx="8"/>
<text x="180" y="199.5" class="mt" text-anchor="middle">RoleDto { type, permissions }</text>
<path class="e" d="M330 195 L380 195" marker-end="url(#a)"/>
<rect class="data" x="380" y="170" width="200" height="50" rx="8"/>
<text x="480" y="192" class="t" text-anchor="middle">Redis</text>
<text x="480" y="209" class="s" text-anchor="middle">user:&lt;id&gt;:&lt;tenant&gt;</text>
<path class="e" d="M580 195 L630 195" marker-end="url(#a)"/>
<rect class="box" x="630" y="170" width="300" height="50" rx="8"/>
<text x="780" y="192" class="t" text-anchor="middle">local cache</text>
<text x="780" y="209" class="s" text-anchor="middle">1 minute</text>
<path class="e" d="M180 220 L180 270" marker-end="url(#a)"/>
<path class="e" d="M780 220 L780 270" marker-end="url(#a)"/>
<rect class="box" x="30" y="270" width="300" height="50" rx="8"/>
<text x="180" y="299.5" class="mt" text-anchor="middle">HeaderAuthFilter</text>
<rect class="box" x="630" y="270" width="300" height="50" rx="8"/>
<text x="780" y="299.5" class="mt" text-anchor="middle">HeaderAuthFilter</text>
<path class="e" d="M180 320 L180 395 L255 395" marker-end="url(#a)"/>
<path class="e" d="M780 320 L780 395 L705 395" marker-end="url(#a)"/>
<rect class="box" x="255" y="365" width="450" height="60" rx="8"/>
<text x="480" y="384.5" class="mt" text-anchor="middle">CustomUserDetails</text>
<text x="480" y="401.5" class="s" text-anchor="middle">kleinkauf-common</text>
<text x="480" y="416.5" class="s" text-anchor="middle">ROLE_&lt;role&gt; + PERM_&lt;area&gt;</text>
<path class="e" d="M480 425 L480 470" marker-end="url(#a)"/>
<rect class="box" x="255" y="470" width="450" height="56" rx="8"/>
<text x="480" y="495" class="mt" text-anchor="middle">SecurityConfig</text>
<text x="480" y="512" class="s" text-anchor="middle">hasRole(...) · hasAuthority(&quot;PERM_STOCK&quot;)</text>
</svg>
