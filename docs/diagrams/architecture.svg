<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="KleinKauf architecture">
<title>KleinKauf architecture</title>
<style>
svg{--bg:#fafaf9;--card:#ffffff;--border:#d6d3d1;--ink:#1c1917;--muted:#78716c;--line:#a8a29e;--accent:#1677bd;--wash:#e8f2fa;--wash-border:#9cc6e6;--data:#f5f5f4;--paid:#e7f5ec;--paid-border:#8cc9a2;--final:#f1f0ef}
@media (prefers-color-scheme: dark){svg{--bg:#0f1419;--card:#1a2027;--border:#3a434d;--ink:#e6edf3;--muted:#9aa4af;--line:#5f6b77;--accent:#2b7fc4;--wash:#13283a;--wash-border:#2f5f88;--data:#1f262e;--paid:#14291d;--paid-border:#2f6b45;--final:#22282f}}
text{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--border);stroke-width:1}
.accent{fill:var(--accent);stroke:none}
.data{fill:var(--data);stroke:var(--border);stroke-width:1}
.client{fill:var(--wash);stroke:var(--wash-border);stroke-width:1}
.note{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.paid{fill:var(--paid);stroke:var(--paid-border);stroke-width:1}
.final{fill:var(--final);stroke:var(--muted);stroke-width:1.5}
.head{fill:var(--wash)}
.sep{stroke:var(--border);stroke-width:1}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:var(--muted)}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12px}
.mt{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12.5px;font-weight:600}
.r{font-size:12.5px}
.on-accent{fill:#ffffff}
.on-accent-s{fill:#dbeaf7;font-size:12px}
.lane{font-size:12px;font-weight:600;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.badge{fill:var(--accent)}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}
.l{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.lp{stroke:var(--card)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="960" height="500" rx="12"/>
<rect class="client" x="40" y="40" width="160" height="56" rx="8"/>
<text x="120" y="65" class="t" text-anchor="middle">Browser</text>
<text x="120" y="82" class="s" text-anchor="middle">store or platform</text>
<path class="e" d="M200 68 L330 68" marker-end="url(#a)"/>
<rect class="box" x="330" y="40" width="300" height="56" rx="8"/>
<text x="480" y="65" class="t" text-anchor="middle">Frontend</text>
<text x="480" y="82" class="s" text-anchor="middle">Vite + React · :2999</text>
<path class="e" d="M480 96 L480 150" marker-end="url(#a)"/>
<text x="490" y="127" class="l" text-anchor="start">HTTP · WebSocket</text>
<rect class="box" x="40" y="150" width="180" height="60" rx="8"/>
<text x="130" y="177" class="t" text-anchor="middle">Eureka</text>
<text x="130" y="194" class="s" text-anchor="middle">service discovery · :8761</text>
<path class="e dash" d="M220 180 L330 180"/>
<text x="275" y="174" class="l" text-anchor="middle">lb://</text>
<rect class="accent" x="330" y="150" width="300" height="60" rx="8"/>
<text x="480" y="177" class="t on-accent" text-anchor="middle">Gateway</text>
<text x="480" y="194" class="on-accent-s" text-anchor="middle">Spring Cloud Gateway · :3000</text>
<path class="e" d="M630 180 L740 180" marker-end="url(#a)" marker-start="url(#a)"/>
<rect class="data" x="740" y="150" width="180" height="60" rx="8"/>
<text x="830" y="177" class="t" text-anchor="middle">Redis</text>
<text x="830" y="194" class="s" text-anchor="middle">cache · rate limit · events</text>
<path class="e" d="M480 210 L480 245"/>
<path class="e" d="M140 245 L830 245"/>
<path class="e" d="M140 245 L140 280" marker-end="url(#a)"/>
<path class="e" d="M370 245 L370 280" marker-end="url(#a)"/>
<path class="e" d="M600 245 L600 280" marker-end="url(#a)"/>
<path class="e" d="M830 245 L830 280" marker-end="url(#a)"/>
<rect class="box" x="55" y="280" width="170" height="70" rx="8"/>
<text x="140" y="304.5" class="t" text-anchor="middle">users</text>
<text x="140" y="321.5" class="s" text-anchor="middle">kleinkaufusers</text>
<text x="140" y="336.5" class="s" text-anchor="middle">:3001</text>
<rect class="box" x="285" y="280" width="170" height="70" rx="8"/>
<text x="370" y="304.5" class="t" text-anchor="middle">products</text>
<text x="370" y="321.5" class="s" text-anchor="middle">kleinkauf-product</text>
<text x="370" y="336.5" class="s" text-anchor="middle">:3002</text>
<rect class="box" x="515" y="280" width="170" height="70" rx="8"/>
<text x="600" y="304.5" class="t" text-anchor="middle">sales</text>
<text x="600" y="321.5" class="s" text-anchor="middle">kleinkauf-sales</text>
<text x="600" y="336.5" class="s" text-anchor="middle">:3003</text>
<rect class="box" x="745" y="280" width="170" height="70" rx="8"/>
<text x="830" y="304.5" class="t" text-anchor="middle">observability</text>
<text x="830" y="321.5" class="s" text-anchor="middle">kleinkauf-observability</text>
<text x="830" y="336.5" class="s" text-anchor="middle">:3004</text>
<path class="e" d="M285 322 L225 322" marker-end="url(#a)"/>
<text x="255" y="312" class="l" text-anchor="middle">internal</text>
<path class="e" d="M515 322 L455 322" marker-end="url(#a)"/>
<text x="485" y="312" class="l" text-anchor="middle">internal</text>
<path class="e" d="M140 350 L140 410" marker-end="url(#a)"/>
<path class="e" d="M370 350 L370 410" marker-end="url(#a)"/>
<path class="e" d="M600 350 L600 410" marker-end="url(#a)"/>
<path class="e" d="M830 350 L830 410" marker-end="url(#a)"/>
<rect class="data" x="55" y="410" width="860" height="56" rx="8"/>
<text x="485" y="435" class="t" text-anchor="middle">PostgreSQL</text>
<text x="485" y="452" class="s" text-anchor="middle">one database per service · one schema per store</text>
</svg>
