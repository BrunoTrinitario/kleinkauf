<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Backend services and how they talk to each other">
<title>Backend services and how they talk to each other</title>
<style>
svg{--bg:#fafaf9;--card:#ffffff;--border:#d6d3d1;--ink:#1c1917;--muted:#78716c;--line:#a8a29e;--accent:#1677bd;--wash:#e8f2fa;--wash-border:#9cc6e6;--data:#f5f5f4;--paid:#e7f5ec;--paid-border:#8cc9a2;--final:#f1f0ef}
@media (prefers-color-scheme: dark){svg{--bg:#0f1419;--card:#1a2027;--border:#3a434d;--ink:#e6edf3;--muted:#9aa4af;--line:#5f6b77;--accent:#2b7fc4;--wash:#13283a;--wash-border:#2f5f88;--data:#1f262e;--paid:#14291d;--paid-border:#2f6b45;--final:#22282f}}
text{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--border);stroke-width:1}
.accent{fill:var(--accent);stroke:none}
.data{fill:var(--data);stroke:var(--border);stroke-width:1}
.client{fill:var(--wash);stroke:var(--wash-border);stroke-width:1}
.note{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.paid{fill:var(--paid);stroke:var(--paid-border);stroke-width:1}
.final{fill:var(--final);stroke:var(--muted);stroke-width:1.5}
.head{fill:var(--wash)}
.sep{stroke:var(--border);stroke-width:1}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:var(--muted)}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12px}
.mt{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12.5px;font-weight:600}
.r{font-size:12.5px}
.on-accent{fill:#ffffff}
.on-accent-s{fill:#dbeaf7;font-size:12px}
.lane{font-size:12px;font-weight:600;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.badge{fill:var(--accent)}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}
.l{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.lp{stroke:var(--card)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="960" height="640" rx="12"/>
<rect class="client" x="220" y="30" width="250" height="56" rx="8"/>
<text x="345" y="55" class="t" text-anchor="middle">Store frontend</text>
<text x="345" y="72" class="s" text-anchor="middle">http://&lt;store&gt;.localhost:2999</text>
<rect class="client" x="490" y="30" width="250" height="56" rx="8"/>
<text x="615" y="55" class="t" text-anchor="middle">Platform frontend</text>
<text x="615" y="72" class="s" text-anchor="middle">http://localhost:2999</text>
<path class="e" d="M345 86 L345 108 L450 108 L450 130" marker-end="url(#a)"/>
<path class="e" d="M615 86 L615 108 L510 108 L510 130" marker-end="url(#a)"/>
<rect class="accent" x="355" y="130" width="250" height="60" rx="8"/>
<text x="480" y="157" class="t on-accent" text-anchor="middle">gateway :3000</text>
<text x="480" y="174" class="on-accent-s" text-anchor="middle">single public entry point</text>
<path class="e" d="M605 160 L720 160" marker-end="url(#a)" marker-start="url(#a)"/>
<rect class="data" x="720" y="130" width="200" height="60" rx="8"/>
<text x="820" y="157" class="t" text-anchor="middle">Redis</text>
<text x="820" y="174" class="s" text-anchor="middle">cache · rate limit · events</text>
<path class="e" d="M480 190 L480 235"/>
<text x="490" y="218" class="l" text-anchor="start">Eureka (lb://)</text>
<path class="e" d="M160 235 L800 235"/>
<path class="e" d="M160 235 L160 280" marker-end="url(#a)"/>
<path class="e" d="M480 235 L480 280" marker-end="url(#a)"/>
<path class="e" d="M800 235 L800 280" marker-end="url(#a)"/>
<rect class="box" x="60" y="280" width="200" height="64" rx="8"/>
<text x="160" y="309" class="t" text-anchor="middle">kleinkaufusers</text>
<text x="160" y="326" class="s" text-anchor="middle">users, auth, roles, tenants · :3001</text>
<rect class="box" x="380" y="280" width="200" height="64" rx="8"/>
<text x="480" y="309" class="t" text-anchor="middle">products</text>
<text x="480" y="326" class="s" text-anchor="middle">catalog and stock · :3002</text>
<rect class="box" x="700" y="280" width="200" height="64" rx="8"/>
<text x="800" y="309" class="t" text-anchor="middle">kleinkauf-sales</text>
<text x="800" y="326" class="s" text-anchor="middle">orders and payments · :3003</text>
<path class="e" d="M380 312 L260 312" marker-end="url(#a)"/>
<text x="320" y="302" class="l" text-anchor="middle">roles · tenants</text>
<path class="e" d="M700 312 L580 312" marker-end="url(#a)"/>
<text x="640" y="302" class="l" text-anchor="middle">reservations · sold</text>
<path class="e" d="M760 344 L760 372 L200 372 L200 344" marker-end="url(#a)"/>
<text x="640" y="366" class="l" text-anchor="middle">roles · order email</text>
<path class="e" d="M160 344 L160 410" marker-end="url(#a)"/>
<path class="e" d="M480 344 L480 410" marker-end="url(#a)"/>
<path class="e" d="M800 344 L800 410" marker-end="url(#a)"/>
<rect class="data" x="60" y="410" width="200" height="56" rx="8"/>
<text x="160" y="435" class="t" text-anchor="middle">Postgres “users”</text>
<text x="160" y="452" class="s" text-anchor="middle">schema per store + public</text>
<rect class="data" x="380" y="410" width="200" height="56" rx="8"/>
<text x="480" y="435" class="t" text-anchor="middle">Postgres “products”</text>
<text x="480" y="452" class="s" text-anchor="middle">schema per store</text>
<rect class="data" x="700" y="410" width="200" height="56" rx="8"/>
<text x="800" y="435" class="t" text-anchor="middle">Postgres “sales”</text>
<text x="800" y="452" class="s" text-anchor="middle">schema per store</text>
<rect class="note" x="40" y="500" width="400" height="72" rx="8"/>
<text x="240" y="525.5" class="t" text-anchor="middle">kleinkauf-observability :3004</text>
<text x="240" y="542.5" class="s" text-anchor="middle">health, metrics, events, audit log and WebSocket</text>
<text x="240" y="557.5" class="s" text-anchor="middle">Postgres “observability”</text>
<rect class="note" x="460" y="500" width="210" height="72" rx="8"/>
<text x="565" y="533" class="t" text-anchor="middle">eureka :8761</text>
<text x="565" y="550" class="s" text-anchor="middle">service registry</text>
<rect class="note" x="690" y="500" width="230" height="72" rx="8"/>
<text x="805" y="533" class="t" text-anchor="middle">kleinkauf-common</text>
<text x="805" y="550" class="s" text-anchor="middle">shared library (not a service)</text>
<text x="480" y="610" class="s" text-anchor="middle">Internal calls go to /api/internal/** with a signed internal token, through Eureka, with Resilience4j.</text>
</svg>
