<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-label="Order states">
<title>Order states</title>
<style>
svg{--bg:#fafaf9;--card:#ffffff;--border:#d6d3d1;--ink:#1c1917;--muted:#78716c;--line:#a8a29e;--accent:#1677bd;--wash:#e8f2fa;--wash-border:#9cc6e6;--data:#f5f5f4;--paid:#e7f5ec;--paid-border:#8cc9a2;--final:#f1f0ef}
@media (prefers-color-scheme: dark){svg{--bg:#0f1419;--card:#1a2027;--border:#3a434d;--ink:#e6edf3;--muted:#9aa4af;--line:#5f6b77;--accent:#2b7fc4;--wash:#13283a;--wash-border:#2f5f88;--data:#1f262e;--paid:#14291d;--paid-border:#2f6b45;--final:#22282f}}
text{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--border);stroke-width:1}
.accent{fill:var(--accent);stroke:none}
.data{fill:var(--data);stroke:var(--border);stroke-width:1}
.client{fill:var(--wash);stroke:var(--wash-border);stroke-width:1}
.note{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.paid{fill:var(--paid);stroke:var(--paid-border);stroke-width:1}
.final{fill:var(--final);stroke:var(--muted);stroke-width:1.5}
.head{fill:var(--wash)}
.sep{stroke:var(--border);stroke-width:1}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:var(--muted)}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12px}
.mt{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12.5px;font-weight:600}
.r{font-size:12.5px}
.on-accent{fill:#ffffff}
.on-accent-s{fill:#dbeaf7;font-size:12px}
.lane{font-size:12px;font-weight:600;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.badge{fill:var(--accent)}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}
.l{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.lp{stroke:var(--card)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="1080" height="350" rx="12"/>
<rect class="box" x="30" y="110" width="130" height="36" rx="18"/>
<text x="95" y="132" class="mt" text-anchor="middle">PENDIENTE_PAGO</text>
<path class="e" d="M160 128 L280 128" marker-end="url(#a)"/>
<text x="220" y="120" class="l" text-anchor="middle">uploads receipt</text>
<rect class="box" x="280" y="110" width="145" height="36" rx="18"/>
<text x="352.5" y="132" class="mt" text-anchor="middle">PAGO_EN_REVISION</text>
<path class="e" d="M425 128 L515 128" marker-end="url(#a)"/>
<text x="470" y="120" class="l" text-anchor="middle">validates</text>
<rect class="paid" x="515" y="110" width="75" height="36" rx="18"/>
<text x="552.5" y="132" class="mt" text-anchor="middle">PAGADO</text>
<path class="e" d="M590 128 L640 128" marker-end="url(#a)"/>
<rect class="paid" x="640" y="110" width="130" height="36" rx="18"/>
<text x="705" y="132" class="mt" text-anchor="middle">EN_PREPARACION</text>
<path class="e" d="M770 128 L820 128" marker-end="url(#a)"/>
<rect class="paid" x="820" y="110" width="70" height="36" rx="18"/>
<text x="855" y="132" class="mt" text-anchor="middle">LISTO</text>
<path class="e" d="M890 128 L940 128" marker-end="url(#a)"/>
<rect class="final" x="940" y="110" width="105" height="36" rx="18"/>
<text x="992.5" y="132" class="mt" text-anchor="middle">ENTREGADO</text>
<path class="e" d="M95 110 L95 70 L552 70 L552 110" marker-end="url(#a)"/>
<text x="323" y="64" class="l" text-anchor="middle">validates without a receipt (paid some other way)</text>
<path class="e" d="M335 146 L335 210" marker-end="url(#a)"/>
<text x="327" y="182" class="l" text-anchor="end">rejects (with a reason)</text>
<path class="e" d="M370 210 L370 146" marker-end="url(#a)"/>
<text x="378" y="182" class="l" text-anchor="start">uploads again</text>
<rect class="box" x="290" y="210" width="125" height="36" rx="18"/>
<text x="352.5" y="232" class="mt" text-anchor="middle">RECHAZADO</text>
<path class="e" d="M415 228 L552 228 L552 146" marker-end="url(#a)"/>
<text x="484" y="222" class="l" text-anchor="middle">validates</text>
<path class="e" d="M95 146 L95 210" marker-end="url(#a)"/>
<text x="103" y="182" class="l" text-anchor="start">deadline passes</text>
<path class="e" d="M290 228 L150 228" marker-end="url(#a)"/>
<text x="220" y="222" class="l" text-anchor="middle">deadline passes</text>
<rect class="final" x="40" y="210" width="110" height="36" rx="18"/>
<text x="95" y="232" class="mt" text-anchor="middle">VENCIDO</text>
<rect class="final" x="640" y="210" width="120" height="36" rx="18"/>
<text x="700" y="232" class="mt" text-anchor="middle">CANCELADO</text>
<text x="775" y="224" class="s" text-anchor="start">from any state before ENTREGADO, with a reason</text>
<text x="775" y="240" class="s" text-anchor="start">(an in-store sale can also be voided once ENTREGADO)</text>
<rect class="box" x="30" y="290" width="14" height="14" rx="4"/>
<text x="52" y="302" class="s" text-anchor="start">waiting for payment · stock reserved</text>
<rect class="paid" x="300" y="290" width="14" height="14" rx="4"/>
<text x="322" y="302" class="s" text-anchor="start">paid · stock deducted, counts as a sale</text>
<rect class="final" x="590" y="290" width="14" height="14" rx="4"/>
<text x="612" y="302" class="s" text-anchor="start">final</text>
<text x="30" y="330" class="s" text-anchor="start">In-store sales start as PAGADO or ENTREGADO.</text>
</svg>
