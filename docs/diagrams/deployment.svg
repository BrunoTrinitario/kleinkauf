<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="How the server is laid out">
<title>How the server is laid out</title>
<style>
svg{--bg:#fafaf9;--card:#ffffff;--border:#d6d3d1;--ink:#1c1917;--muted:#78716c;--line:#a8a29e;--accent:#1677bd;--wash:#e8f2fa;--wash-border:#9cc6e6;--data:#f5f5f4;--paid:#e7f5ec;--paid-border:#8cc9a2;--final:#f1f0ef}
@media (prefers-color-scheme: dark){svg{--bg:#0f1419;--card:#1a2027;--border:#3a434d;--ink:#e6edf3;--muted:#9aa4af;--line:#5f6b77;--accent:#2b7fc4;--wash:#13283a;--wash-border:#2f5f88;--data:#1f262e;--paid:#14291d;--paid-border:#2f6b45;--final:#22282f}}
text{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--border);stroke-width:1}
.accent{fill:var(--accent);stroke:none}
.data{fill:var(--data);stroke:var(--border);stroke-width:1}
.client{fill:var(--wash);stroke:var(--wash-border);stroke-width:1}
.note{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.paid{fill:var(--paid);stroke:var(--paid-border);stroke-width:1}
.final{fill:var(--final);stroke:var(--muted);stroke-width:1.5}
.head{fill:var(--wash)}
.sep{stroke:var(--border);stroke-width:1}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:var(--muted)}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12px}
.mt{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12.5px;font-weight:600}
.r{font-size:12.5px}
.on-accent{fill:#ffffff}
.on-accent-s{fill:#dbeaf7;font-size:12px}
.lane{font-size:12px;font-weight:600;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.badge{fill:var(--accent)}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}
.l{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.lp{stroke:var(--card)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="960" height="520" rx="12"/>
<rect class="client" x="380" y="30" width="200" height="44" rx="8"/>
<text x="480" y="56.5" class="t" text-anchor="middle">Internet</text>
<path class="e" d="M480 74 L480 120" marker-end="url(#a)"/>
<text x="490" y="101" class="l" text-anchor="start">80 / 443</text>
<rect class="accent" x="320" y="120" width="320" height="60" rx="8"/>
<text x="480" y="147" class="t on-accent" text-anchor="middle">Caddy</text>
<text x="480" y="164" class="on-accent-s" text-anchor="middle">HTTPS (Let's Encrypt) · routing by host</text>
<path class="e" d="M420 180 L420 220 L280 220 L280 260" marker-end="url(#a)"/>
<text x="270" y="244" class="l" text-anchor="end">&lt;domain&gt; · &lt;store&gt;.&lt;domain&gt;</text>
<path class="e" d="M540 180 L540 220 L680 220 L680 260" marker-end="url(#a)"/>
<text x="690" y="244" class="l" text-anchor="start">api.&lt;domain&gt;</text>
<rect class="box" x="150" y="260" width="260" height="60" rx="8"/>
<text x="280" y="287" class="t" text-anchor="middle">frontend</text>
<text x="280" y="304" class="s" text-anchor="middle">nginx · static app</text>
<rect class="box" x="550" y="260" width="260" height="60" rx="8"/>
<text x="680" y="287" class="t" text-anchor="middle">gateway</text>
<text x="680" y="304" class="s" text-anchor="middle">:3000</text>
<path class="e" d="M680 320 L680 370" marker-end="url(#a)"/>
<rect class="note" x="450" y="370" width="460" height="120" rx="10"/>
<text x="470" y="392" class="lane" text-anchor="start">internal Docker network</text>
<rect class="box" x="470" y="406" width="95" height="32" rx="6"/>
<text x="517.5" y="426.5" class="t" text-anchor="middle">users</text>
<rect class="box" x="575" y="406" width="95" height="32" rx="6"/>
<text x="622.5" y="426.5" class="t" text-anchor="middle">products</text>
<rect class="box" x="680" y="406" width="95" height="32" rx="6"/>
<text x="727.5" y="426.5" class="t" text-anchor="middle">sales</text>
<rect class="box" x="785" y="406" width="110" height="32" rx="6"/>
<text x="840" y="426.5" class="t" text-anchor="middle">observability</text>
<rect class="box" x="470" y="448" width="120" height="32" rx="6"/>
<text x="530" y="468.5" class="t" text-anchor="middle">Eureka</text>
<rect class="data" x="600" y="448" width="120" height="32" rx="6"/>
<text x="660" y="468.5" class="t" text-anchor="middle">PostgreSQL</text>
<rect class="data" x="730" y="448" width="120" height="32" rx="6"/>
<text x="790" y="468.5" class="t" text-anchor="middle">Redis</text>
</svg>
