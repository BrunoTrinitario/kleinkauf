#CI: en cada push a main (y en los PR contra main) corre los tests de cada servicio del backend y el build del frontend.
#No despliega: el deploy sigue siendo el push a deploy/backend y deploy/frontend (deploy.yml, en esas ramas).
#Los tests que levantan la app usan Testcontainers: el runner de GitHub tiene Docker, asi que corren con Postgres y
#Redis reales. Eureka no esta: esos tests avisan en el log que no se pueden registrar y siguen.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

#Un push nuevo a la misma rama corta el CI que estaba corriendo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests de ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [kleinkauf-common, eureka, gateway, kleinkaufusers, kleinkauf-product, kleinkauf-sales, kleinkauf-observability]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      #Cachea las dependencias de Gradle entre corridas
      - uses: gradle/actions/setup-gradle@v4

      #Cada servicio es un build propio que incluye kleinkauf-common (gradlew no tiene permiso de ejecucion en git)
      - name: Tests
        working-directory: backend/${{ matrix.service }}
        run: bash ./gradlew test --no-daemon

      - name: Reporte de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Build del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      #La misma version que la imagen de produccion (frontend/Dockerfile)
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      #tsc -b y vite build: falla con errores de tipos
      - run: npm run build
