services:
  product-service:
    image: gradle:8.14.3-jdk21
    container_name: product-service
    working_dir: /app
    volumes:
      - ../com.decor.product:/app
      - ../decor-common:/decor-common
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "3002:3002"
    command: gradle bootRun
    restart: unless-stopped

  user-service:
    image: gradle:8.14.3-jdk21
    container_name: user-service
    working_dir: /app
    volumes:
      - ../decorusers:/app
      - ../decor-common:/decor-common
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "3001:3001"
    command: gradle bootRun
    restart: unless-stopped

  gateway-service:
    image: gradle:8.14.3-jdk21
    container_name: gateway-service
    working_dir: /app
    volumes:
      - ../gateway:/app
      - ../decor-common:/decor-common
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "3000:3000"
    command: gradle bootRun
    restart: unless-stopped
volumes:
  gradle-cache: