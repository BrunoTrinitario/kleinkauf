#service name and port
server.port=3001
spring.application.name=users-microservice

# Profile photos (see AvatarStorage). The service checks the 1 MB limit itself; Spring's limit is higher so the
# user gets that message instead of a generic one
avatar.path=uploads/users/avatars
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

#Loggin levels
logging.level.org.springframework.security=TRACE
logging.level.com.kleinkauf.users.kleinkaufusers=DEBUG

#Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

#secrets to create the client access token and the microservice jwt
jwt.secret=MiSuperSecretoUltraSeguro123456789
api.internal.key=secretomagico123supermegaseguro123

#Master db configuration in postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.main.allow-circular-references=true

#eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Mail (docs/mail.md): Resend by SMTP. MAIL_PASSWORD is Resend's sending-only API key; without it no email goes out
#(it stays in the log as ERROR). Every email goes out as "<store name>" <MAIL_FROM> with the store owner as Reply-To
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.address=${MAIL_FROM:no-reply@mail.kleinkauf.site}
mail.from.platform-name=KleinKauf
#products: store name for the emails' sender
products.url=http://products-microservice/
#The tenant is optional in users (login/sign-up without a tenant)
kleinkauf.tenant.required=false

#Platform: each tenant's URL = <scheme>://<identifier>.<domain>
#In development browsers resolve *.localhost on their own (e.g. http://mitienda.localhost:2999, the frontend port)
#Zone of the dashboard days (sign-ups per period). Dates are stored in server time (UTC in Docker)
users.dashboard.zone=America/Argentina/Buenos_Aires
platform.scheme=http
platform.domain=localhost:2999
#First superadmin (created at startup if it does not exist). Empty = not created
platform.superadmin.email=${SUPERADMIN_EMAIL:}
platform.superadmin.password=${SUPERADMIN_PASSWORD:}

#Observability (kleinkauf-common, docs/observabilidad.md): /health, /ready and /metrics on the management port.
#It is internal: the gateway does not expose it. Read by Docker, Prometheus and observability
management.server.port=9001
#Left out of /ready: mail (with the example credentials it would be DOWN and the service would never be ready,
#and if it fails it only affects password recovery) and RabbitMQ, which is not used
management.health.mail.enabled=false
management.health.rabbit.enabled=false
