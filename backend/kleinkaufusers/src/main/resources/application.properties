#nombre y puerto del servicio
server.port=3001
spring.application.name=users-microservice

#Loggin levels
logging.level.org.springframework.security=TRACE
logging.level.com.kleinkauf.users.kleinkaufusers=DEBUG

#Configuracion de Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#secretos para crear el token de acceso a cliente y para crear el jwt de microservicios
jwt.secret=MiSuperSecretoUltraSeguro123456789
api.internal.key=secretomagico123supermegaseguro123

#Confgiracion de la master db en postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.main.allow-circular-references=true

#Configuracion eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Configuracion de mailer
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tuMail@gmail.com
spring.mail.password=tu_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#El tenant es opcional en users (login/registro sin tenant)
kleinkauf.tenant.required=false

#Plataforma: URL de cada tenant = <scheme>://<identificador>.<domain>
#En desarrollo los navegadores resuelven *.localhost solos (ej. http://mitienda.localhost:2999, el puerto del frontend)
platform.scheme=http
platform.domain=localhost:2999
#Primer superadmin (se crea al arrancar si no existe). Vacio = no se crea
platform.superadmin.email=${SUPERADMIN_EMAIL:}
platform.superadmin.password=${SUPERADMIN_PASSWORD:}

#Observabilidad (kleinkauf-common, docs/observabilidad.md): /health, /ready y /metrics en el puerto de gestion.
#Es interno: el gateway no lo expone. Lo leen Docker, Prometheus y observability
management.server.port=9001
#Fuera de /ready: el mail (con las credenciales de ejemplo daria DOWN y el servicio nunca estaria listo,
#y si falla solo afecta a recuperar la contrasena) y RabbitMQ, que no se usa
management.health.mail.enabled=false
management.health.rabbit.enabled=false
