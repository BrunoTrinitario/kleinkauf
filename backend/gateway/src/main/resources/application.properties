#service name and port
spring.application.name=gateway-microservice
server.port=3000

#Secret to validate client JWTs and for microservice JWTs
jwt.secret=MiSuperSecretoUltraSeguro123456789
api.internal.key=secretomagico123supermegaseguro123

#Redirects using eureka to make use of the microservices
tenant.url = lb://users-microservice/api/internal/tenants
users.url = lb://users-microservice
products.url = lb://products-microservice
sales.url = lb://sales-microservice
observability.url = lb://observability-microservice
observability.ws-url = lb:ws://observability-microservice

#Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cloud.gateway.server.webflux.redis-rate-limiter.include-headers=true

#Eureka configuration, ip, self-registration, force ip
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Rate limit configuration
limit.login = 5
limit.global = 300
limit.signup = 3
limit.minutes = 1
#Checkout: creating orders, looking up or cancelling an order as a guest and uploading receipts
limit.order = 5
limit.lookup = 10
limit.receipt = 5

#Platform frontend (tenant sign-up and superadmin dashboard): allowed by CORS
platform.url=http://localhost:2999

#Timeout of the calls to other microservices
http.client.timeout=3s

#Resilience4j for the calls to the users microservice (tenants and CORS)
#Circuit breaker: if 50% of the last 10 calls fail, it opens for 10 sec and then tries with 3
resilience4j.circuitbreaker.instances.users.sliding-window-size=10
resilience4j.circuitbreaker.instances.users.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.users.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.users.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.users.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.users.automatic-transition-from-open-to-half-open-enabled=true
#4xx are request errors, not users being down
resilience4j.circuitbreaker.instances.users.record-failure-predicate=com.kleinkauf.gateway.config.RemoteFailurePredicate
#Retry: up to 3 attempts with 200ms wait; does not retry 4xx nor with the circuit open
resilience4j.retry.instances.users.max-attempts=3
resilience4j.retry.instances.users.wait-duration=200ms
resilience4j.retry.instances.users.retry-exception-predicate=com.kleinkauf.gateway.config.RemoteFailurePredicate


# Shows route and filter matching
#logging.level.org.springframework.cloud.gateway=DEBUG
#
## Muestra detalles de RequestRateLimiter, RewritePath, etc.
#logging.level.org.springframework.cloud.gateway.filter=TRACE
#
## Shows how routes are resolved
#logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=TRACE
#
## Shows the forwarding to the microservices
#logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=TRACE
#
## Reactive HTTP client logs (internal WebClient)
#logging.level.reactor.netty.http.client=DEBUG
#
## Logs del servidor Netty
#logging.level.reactor.netty.http.server=DEBUG
#
## Logs generales de WebFlux
#logging.level.org.springframework.web=DEBUG
#
## Security logs (JWT, filters, auth)
#logging.level.org.springframework.security=DEBUG

spring.webflux.cors.enabled=false
#Observability (kleinkauf-common, docs/observabilidad.md): /health, /ready and /metrics on the management port.
#It is internal: the gateway does not expose it. Read by Docker, Prometheus and observability
management.server.port=9000
