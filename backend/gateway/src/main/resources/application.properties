#nombre y puerto del servicio
spring.application.name=gateway-microservice
server.port=3000

#Secreto para validar los JWT de clientes y para JWT de microservicios
jwt.secret=MiSuperSecretoUltraSeguro123456789
api.internal.key=secretomagico123supermegaseguro123

#Redirects usando eureka para hacer uso de los microservicios
tenant.url = lb://users-microservice/api/internal/tenants
users.url = lb://users-microservice
products.url = lb://products-microservice
sales.url = lb://sales-microservice

#Configuracion de Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cloud.gateway.server.webflux.redis-rate-limiter.include-headers=true

#Configuracion de Eureka, ip, auto-registro, forzar a ip
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Configuracion de limite de llamadas
limit.login = 5
limit.global = 300
limit.signup = 3
limit.minutes = 1
#Checkout: crear pedidos, consultar o cancelar un pedido como invitado y subir comprobantes
limit.order = 5
limit.lookup = 10
limit.receipt = 5

#Frontend de la plataforma (alta de tenants y panel del superadmin): se permite por CORS
platform.url=http://localhost:2999

#Timeout de las llamadas a otros microservicios
http.client.timeout=3s

#Resilience4j para las llamadas al microservicio de usuarios (tenants y CORS)
#Circuit breaker: si falla el 50% de las ultimas 10 llamadas, corta 10 seg y despues prueba con 3
resilience4j.circuitbreaker.instances.users.sliding-window-size=10
resilience4j.circuitbreaker.instances.users.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.users.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.users.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.users.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.users.automatic-transition-from-open-to-half-open-enabled=true
#Los 4xx son errores del pedido, no de que users este caido
resilience4j.circuitbreaker.instances.users.record-failure-predicate=com.decor.gateway.config.RemoteFailurePredicate
#Retry: hasta 3 intentos con 200ms de espera; no reintenta 4xx ni con el circuito abierto
resilience4j.retry.instances.users.max-attempts=3
resilience4j.retry.instances.users.wait-duration=200ms
resilience4j.retry.instances.users.retry-exception-predicate=com.decor.gateway.config.RemoteFailurePredicate


# Muestra el matching de rutas y filtros
#logging.level.org.springframework.cloud.gateway=DEBUG
#
## Muestra detalles de RequestRateLimiter, RewritePath, etc.
#logging.level.org.springframework.cloud.gateway.filter=TRACE
#
## Muestra cómo se resuelven las rutas
#logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=TRACE
#
## Muestra el forwarding hacia los microservicios
#logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=TRACE
#
## Logs del cliente HTTP reactivo (WebClient interno)
#logging.level.reactor.netty.http.client=DEBUG
#
## Logs del servidor Netty
#logging.level.reactor.netty.http.server=DEBUG
#
## Logs generales de WebFlux
#logging.level.org.springframework.web=DEBUG
#
## Logs de seguridad (JWT, filtros, auth)
#logging.level.org.springframework.security=DEBUG

spring.webflux.cors.enabled=false
#Observabilidad (decor-common, docs/observabilidad.md): /health, /ready y /metrics en el puerto de gestion.
#Es interno: el gateway no lo expone. Lo leen Docker, Prometheus y observability
management.server.port=9000
