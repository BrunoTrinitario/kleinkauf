#nombre y puerto del servicio
spring.application.name=observability-microservice
server.port=3004

#Configuracion de Redis: tickets del WS, ultima actividad de los usuarios y eventos (Redis Streams)
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Paths cargados para eureka: roles y nombres de usuarios
users.url = http://users-microservice/

#Base de la auditoria: un schema por tienda y public para la plataforma (se crean con el primer evento)
spring.datasource.url=jdbc:postgresql://localhost:5432/observability
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#secreto para crear el jwt de microservicios
api.internal.key=secretomagico123supermegaseguro123

#Configuracion eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
#El recolector lee el registro de eureka en cada vuelta: se pide cada 10s (por defecto 30s)
eureka.client.registry-fetch-interval-seconds=10

#Timeouts de las llamadas a users
http.client.connect-timeout=2s
http.client.read-timeout=3s

#Recolector: cada cuanto lee /ready y /metrics de cada instancia y cuanto espera cada respuesta
observability.poll.interval=10s
observability.poll.timeout=2s
#Servicios que tienen que estar: si no hay ninguna instancia en eureka figuran abajo
observability.services=users-microservice,products-microservice,sales-microservice,gateway-microservice,observability-microservice
#Lo que no se registra en eureka: nombre=url del puerto de gestion
observability.static-targets=eureka=http://localhost:9761

#Tickets del WS: duran 30s y sirven una sola vez. Cada minuto se revisa que los conectados sigan teniendo el rol
observability.ticket.ttl=30s
observability.ws.revalidate-interval=60s

#Resilience4j para las llamadas a users
#Circuit breaker: si falla el 50% de las ultimas 10 llamadas, corta 10 seg y despues prueba con 3
resilience4j.circuitbreaker.instances.users.sliding-window-size=10
resilience4j.circuitbreaker.instances.users.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.users.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.users.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.users.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.users.automatic-transition-from-open-to-half-open-enabled=true
#Los 4xx son errores del pedido, no de que el servicio este caido
resilience4j.circuitbreaker.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
#Retry: hasta 3 intentos con 200ms de espera; no reintenta 4xx ni con el circuito abierto
resilience4j.retry.instances.users.max-attempts=3
resilience4j.retry.instances.users.wait-duration=200ms
resilience4j.retry.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

#Observabilidad (decor-common, docs/observabilidad.md): /health, /ready y /metrics en el puerto de gestion.
#Es interno: el gateway no lo expone. Lo leen Docker, Prometheus y observability
management.server.port=9004
