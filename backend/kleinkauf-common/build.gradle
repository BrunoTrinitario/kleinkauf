/*
Shared library of the kleinkauf microservices.
- com.kleinkauf.common: what every service uses (gateway included): DTOs, headers, Redis, Caffeine and internal tokens.
- com.kleinkauf.common.servlet: what the servlet services use (users, products, sales): Hibernate multi-tenancy,
  tenant filter, exceptions and the authenticated user. It is not activated in the (reactive) gateway.
- com.kleinkauf.common.observability: the same Actuator setup everywhere (management port, /health, /ready, /metrics),
  tenant tag on the HTTP metrics and tenant / user in the logs.
Spring dependencies are compileOnly: each service already brings its own, and each auto-configuration
only activates if it finds the classes it needs.
Services consume it as a composite build: includeBuild('../kleinkauf-common') in their settings.gradle.
 */
plugins {
	id 'java-library'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kleinkauf'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.14'
	}
}

dependencies {
	api 'org.springframework.boot:spring-boot-autoconfigure'
	api 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// Optional: each bean is only created if the service has the dependency
	compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
	compileOnly 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
	compileOnly 'org.springframework.boot:spring-boot-starter-security'
	compileOnly 'org.springframework.boot:spring-boot-starter-actuator'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
	testImplementation 'com.github.ben-manes.caffeine:caffeine'
	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
