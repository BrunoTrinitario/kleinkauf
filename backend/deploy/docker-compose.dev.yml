#Levanta todo el backend en modo desarrollo (codigo montado, gradle bootRun)
#Uso: docker compose -f backend/deploy/docker-compose.dev.yml up -d

#Postgres y Redis salen del compose de base de datos, que se puede seguir usando solo
include:
  - docker-compose.bd.yml

#Configuracion comun: imagen de gradle y apuntar a los contenedores en vez de localhost
x-service: &service
  image: gradle:8.14.4-jdk21
  working_dir: /app
  command: gradle bootRun
  restart: unless-stopped
  environment: &service-env
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    #Solo en desarrollo: pedirle la lista de servicios a eureka cada 5s (por defecto 30s) para que
    #despues de un reinicio el gateway encuentre a los servicios en segundos y no en un minuto.
    #El heartbeat y el vencimiento (30s/90s) quedan como estan: bajarlos da de baja servicios sanos
    #durante las pausas de bootRun y activa la autopreservacion de eureka
    EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"

#Healthcheck: /health (liveness) en el puerto de gestion, que es interno y no se publica (docs/observabilidad.md)
#start_period largo porque bootRun compila antes de levantar
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 5m

#Servicios que dependen de la base, redis y eureka
x-depends: &depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  eureka:
    condition: service_healthy

#Cada servicio tiene su propia cache de gradle: bootRun no termina nunca y deja tomado el lock
#de la cache, y gradle no puede pedirle que lo suelte a un proceso de otro contenedor
services:
  eureka:
    <<: *service
    container_name: eureka-service
    volumes:
      - ../eureka:/app
      - ../kleinkauf-common:/kleinkauf-common
      - gradle-cache:/home/gradle/.gradle
      #build y .gradle propios del contenedor para no pisar los del host
      - /app/build
      - /app/.gradle
      - /kleinkauf-common/build
      - /kleinkauf-common/.gradle
    environment:
      #Solo en desarrollo: responder con el registro al dia en vez de una copia que se refresca cada 30s
      EUREKA_SERVER_USEREADONLYRESPONSECACHE: "false"
    ports:
      - "8761:8761"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9761/health"]

  #Cada servicio compila kleinkauf-common en su propio build/ para no chocar con los otros
  product-service:
    <<: *service
    container_name: product-service
    volumes:
      - ../kleinkauf-product:/app
      - ../kleinkauf-common:/kleinkauf-common
      - product-gradle-cache:/home/gradle/.gradle
      - /app/build
      - /app/.gradle
      - /kleinkauf-common/build
      - /kleinkauf-common/.gradle
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/products
    ports:
      - "3002:3002"
    depends_on: *depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9002/health"]

  sales-service:
    <<: *service
    container_name: sales-service
    volumes:
      - ../kleinkauf-sales:/app
      - ../kleinkauf-common:/kleinkauf-common
      - sales-gradle-cache:/home/gradle/.gradle
      - /app/build
      - /app/.gradle
      - /kleinkauf-common/build
      - /kleinkauf-common/.gradle
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sales
    ports:
      - "3003:3003"
    depends_on: *depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9003/health"]

  user-service:
    <<: *service
    container_name: user-service
    volumes:
      - ../kleinkaufusers:/app
      - ../kleinkauf-common:/kleinkauf-common
      - user-gradle-cache:/home/gradle/.gradle
      - /app/build
      - /app/.gradle
      - /kleinkauf-common/build
      - /kleinkauf-common/.gradle
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      #Superadmin de desarrollo, se crea al arrancar si no existe
      SUPERADMIN_EMAIL: superadmin@kleinkauf.local
      SUPERADMIN_PASSWORD: superadmin123
    ports:
      - "3001:3001"
    depends_on: *depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9001/health"]

  #Observabilidad: recolector, eventos, auditoria y WS del panel en tiempo real (docs/observabilidad.md).
  #La base observability la crea init.sql; con un volumen de postgres de antes hay que crearla a mano:
  #  docker exec postgres-dev psql -U postgres -c "CREATE DATABASE observability"
  observability-service:
    <<: *service
    container_name: observability-service
    volumes:
      - ../kleinkauf-observability:/app
      - ../kleinkauf-common:/kleinkauf-common
      - observability-gradle-cache:/home/gradle/.gradle
      - /app/build
      - /app/.gradle
      - /kleinkauf-common/build
      - /kleinkauf-common/.gradle
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/observability
      #Eureka no se registra en si mismo: el recolector lo lee directo
      OBSERVABILITY_STATIC_TARGETS: eureka=http://eureka:9761
    ports:
      - "3004:3004"
    depends_on: *depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9004/health"]

  gateway-service:
    <<: *service
    container_name: gateway-service
    volumes:
      - ../gateway:/app
      - ../kleinkauf-common:/kleinkauf-common
      - gateway-gradle-cache:/home/gradle/.gradle
      - /app/build
      - /app/.gradle
      - /kleinkauf-common/build
      - /kleinkauf-common/.gradle
    environment:
      <<: *service-env
      #Solo en desarrollo: la lista de instancias del load balancer dura 5s (por defecto 35s)
      SPRING_CLOUD_LOADBALANCER_CACHE_TTL: 5s
    ports:
      - "3000:3000"
    depends_on: *depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9000/health"]

  #Seed de desarrollo: crea la tienda demo (http://demo.localhost:2999), la carga con productos
  #(con imagenes genericas por categoria) y usuarios de prueba, y termina. Datos en seed/data.json
  seed:
    image: node:22.11.0-alpine3.20
    container_name: seed
    volumes:
      - ./seed:/seed:ro
    command: ["node", "/seed/seed.mjs"]
    environment:
      GATEWAY_URL: http://gateway-service:3000
      PLATFORM_URL: http://localhost:2999
      STORE_SCHEME: http
      STORE_DOMAIN: localhost:2999
      DEMO_IDENTIFIER: demo
      DEMO_OWNER_NAME: Dueño Demo
      DEMO_OWNER_EMAIL: admin@demo.local
      DEMO_OWNER_PASSWORD: demo1234
    restart: "no"
    depends_on:
      gateway-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy

  #Prueba de punta a punta (e2e/e2e.mjs): solo con --profile e2e. Crea una tienda nueva y la borra al terminar
  e2e:
    image: node:22.11.0-alpine3.20
    profiles: [e2e]
    volumes:
      - ./e2e:/e2e:ro
    command: ["node", "/e2e/e2e.mjs"]
    environment:
      GATEWAY_URL: http://gateway-service:3000
      PLATFORM_URL: http://localhost:2999
      STORE_SCHEME: http
      STORE_DOMAIN: localhost:2999
      SUPERADMIN_EMAIL: superadmin@kleinkauf.local
      SUPERADMIN_PASSWORD: superadmin123
    restart: "no"
    depends_on:
      gateway-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy

volumes:
  #La cache original queda para eureka, que ya la tiene cargada
  gradle-cache:
  product-gradle-cache:
  user-gradle-cache:
  gateway-gradle-cache:
  sales-gradle-cache:
  observability-gradle-cache:
