#Datasources de Grafana. Logs y trazas estan enlazados: desde un log se abre su traza por el traceId
#y desde una traza se ven sus logs
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service=~".+"} | traceId="$${__trace.traceId}"'
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: traceId
          datasourceUid: tempo
          matcherType: label
          matcherRegex: traceId
          url: "$${__value.raw}"
          urlDisplayLabel: Ver traza
