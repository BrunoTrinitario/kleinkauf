#service name and port
spring.application.name=products-microservice
server.port=3002

#Loggin levels
logging.level.org.springframework.security=DEBUG
logging.level.com.kleinkauf.users.kleinkaufusers=DEBUG

#Path where product images are stored
image.path=uploads/products/images
#Images are public files with a random name and do not belong to a tenant: they are served without the tenant
#header (the browser does not send Origin when loading an <img>, so the gateway cannot resolve it)
#The platform dashboard (/api/v1/platform/**) has no tenant either: it is used by the superadmin, who lives in public
kleinkauf.tenant.public-paths=/products/images/,/api/v1/platform/

#Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Path loaded for eureka to query user roles
users.url = http://users-microservice/

#secret to create the microservice jwt
api.internal.key=secretomagico123supermegaseguro123

#Master db configuration in postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/products
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-circular-references=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.engine.jdbc.connections=DEBUG

#eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Timeouts of the calls to other microservices
http.client.connect-timeout=2s
http.client.read-timeout=3s

#Resilience4j for the calls to the users microservice
#Circuit breaker: if 50% of the last 10 calls fail, it opens for 10 sec and then tries with 3
resilience4j.circuitbreaker.instances.users.sliding-window-size=10
resilience4j.circuitbreaker.instances.users.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.users.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.users.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.users.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.users.automatic-transition-from-open-to-half-open-enabled=true
#4xx are request errors, not users being down
resilience4j.circuitbreaker.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
#Retry: up to 3 attempts with 200ms wait; does not retry 4xx nor with the circuit open
resilience4j.retry.instances.users.max-attempts=3
resilience4j.retry.instances.users.wait-duration=200ms
resilience4j.retry.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

#File uploads: import CSV up to 5 MB (images are validated separately at 1 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

#Observability (kleinkauf-common, docs/features/observability.md): /health, /ready and /metrics on the management port.
#It is internal: the gateway does not expose it. Read by Docker, Prometheus and observability
management.server.port=9002
