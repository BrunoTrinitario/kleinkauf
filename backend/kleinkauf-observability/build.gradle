/*
Microservicio de observabilidad (docs/observabilidad.md):
- Recolector: cada pocos segundos lee /ready y /metrics del puerto de gestion de cada instancia de Eureka.
- Eventos: lee los eventos de los servicios en Redis Streams y los reenvia en vivo.
- WebSocket (/ws) con ticket corto: el panel de la plataforma y el de la tienda en tiempo real.
- Auditoria (docs/auditoria.md): la guarda en la base observability (un schema por tienda y public) con JDBC.
  Sin Hibernate a proposito: asi no se activan el multi-tenant ni la auditoria de kleinkauf-common, que son para
  los servicios que la mandan. El estado del recolector sigue en memoria.
 */
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kleinkauf'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.2")
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Observabilidad: /health, /ready y /metrics (Prometheus), traceId en los logs y trazas por OTLP (configurado en kleinkauf-common)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'com.kleinkauf:kleinkauf-common:0.0.1-SNAPSHOT'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.cloud:spring-cloud-starter'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	// La auditoria esta particionada (Postgres): AuditStoreTest la prueba con un Postgres real
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.postgresql:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// La zona del JVM viaja a Postgres al conectar: la de Windows (America/Buenos_Aires) Postgres 17 no la acepta.
	// En el server los contenedores corren en UTC
	systemProperty 'user.timezone', 'UTC'
}

bootRun {
    jvmArgs = ["-Duser.timezone=UTC"]
}
