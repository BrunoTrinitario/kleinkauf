#service name and port
spring.application.name=observability-microservice
server.port=3004

#Redis configuration: WS tickets, users' last activity and events (Redis Streams)
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Paths loaded for eureka: user roles and names
users.url = http://users-microservice/

#Audit database: one schema per store and public for the platform (created with the first event)
spring.datasource.url=jdbc:postgresql://localhost:5432/observability
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#secret to create the microservice jwt
api.internal.key=secretomagico123supermegaseguro123

#eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
#The collector reads the eureka registry on every round: fetched every 10s (default 30s)
eureka.client.registry-fetch-interval-seconds=10

#Timeouts of the calls to users
http.client.connect-timeout=2s
http.client.read-timeout=3s

#Collector: how often it reads /ready and /metrics from each instance and how long it waits for each response
observability.poll.interval=10s
observability.poll.timeout=2s
#Services that must be present: if eureka has no instance of them they show as down
observability.services=users-microservice,products-microservice,sales-microservice,gateway-microservice,observability-microservice
#Where per-store traffic comes from (store.usage channel): each store request goes through the gateway once
observability.gateway-service=gateway-microservice
#What is not registered in eureka: name=url of the management port
observability.static-targets=eureka=http://localhost:9761

#WS tickets: last 30s and work only once. Every minute it checks that online users still have the role
observability.ticket.ttl=30s
observability.ws.revalidate-interval=60s

#Resilience4j for the calls to users
#Circuit breaker: if 50% of the last 10 calls fail, it opens for 10 sec and then tries with 3
resilience4j.circuitbreaker.instances.users.sliding-window-size=10
resilience4j.circuitbreaker.instances.users.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.users.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.users.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.users.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.users.automatic-transition-from-open-to-half-open-enabled=true
#4xx are request errors, not the service being down
resilience4j.circuitbreaker.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
#Retry: up to 3 attempts with 200ms wait; does not retry 4xx nor with the circuit open
resilience4j.retry.instances.users.max-attempts=3
resilience4j.retry.instances.users.wait-duration=200ms
resilience4j.retry.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

#Observability (kleinkauf-common, docs/observabilidad.md): /health, /ready and /metrics on the management port.
#It is internal: the gateway does not expose it. Read by Docker, Prometheus and observability
management.server.port=9004
