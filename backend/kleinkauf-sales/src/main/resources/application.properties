#service name and port
spring.application.name=sales-microservice
server.port=3003

#Loggin levels
logging.level.org.springframework.security=DEBUG

#Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Paths loaded for eureka: user roles and stock reservations
users.url = http://users-microservice/
products.url = http://products-microservice/

#secret to create the microservice jwt
api.internal.key=secretomagico123supermegaseguro123

#Master db configuration in postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/sales
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-circular-references=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Timeouts of the calls to other microservices
http.client.connect-timeout=2s
http.client.read-timeout=3s

#Online order limits: lines per order and units per line
sales.order.max-lines=30
sales.order.max-quantity=20
#In-store sale limits
sales.local.max-lines=100
sales.local.max-quantity=999

#Receipts: on disk (one folder per store), up to 5 per order of up to 5 MB
receipts.path=uploads/sales/receipts
sales.receipts.max-per-order=5
sales.receipts.max-size=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#Store time zone: what "a day" is in the reports and in the order date filters
sales.reports.zone=America/Argentina/Buenos_Aires

#Expiry of orders without a receipt: how often it runs (ISO-8601)
sales.expiration.interval=PT1H
sales.expiration.initial-delay=PT1M

#Resilience4j for the calls to users and products
#Circuit breaker: if 50% of the last 10 calls fail, it opens for 10 sec and then tries with 3
resilience4j.circuitbreaker.instances.users.sliding-window-size=10
resilience4j.circuitbreaker.instances.users.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.users.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.users.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.users.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.users.automatic-transition-from-open-to-half-open-enabled=true
#4xx are request errors, not the service being down
resilience4j.circuitbreaker.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
#Retry: up to 3 attempts with 200ms wait; does not retry 4xx nor with the circuit open
resilience4j.retry.instances.users.max-attempts=3
resilience4j.retry.instances.users.wait-duration=200ms
resilience4j.retry.instances.users.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

#Products: same as users. Reserving and releasing are idempotent by order number, they can be retried
resilience4j.circuitbreaker.instances.products.sliding-window-size=10
resilience4j.circuitbreaker.instances.products.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.products.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.products.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.products.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.products.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.products.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.retry.instances.products.max-attempts=3
resilience4j.retry.instances.products.wait-duration=200ms
resilience4j.retry.instances.products.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

#Observability (kleinkauf-common, docs/observabilidad.md): /health, /ready and /metrics on the management port.
#It is internal: the gateway does not expose it. Read by Docker, Prometheus and observability
management.server.port=9003
