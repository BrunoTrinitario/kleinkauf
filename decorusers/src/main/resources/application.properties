#nombre y puerto del servicio
server.port=3001
spring.application.name=users-microservice

#Loggin levels
logging.level.org.springframework.security=TRACE
logging.level.com.decor.users.decorusers=DEBUG

#Configuracion de Redis
spring.redis.host=localhost
spring.redis.port=6379

#secretos para crear el token de acceso a cliente y para crear el jwt de microservicios
jwt.secret=MiSuperSecretoUltraSeguro123456789
api.internal.key=secretomagico123supermegaseguro123

#Confgiracion de la master db en postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.main.allow-circular-references=true

#Configuracion eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true