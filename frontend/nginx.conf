#Sirve el build de Vite. Escucha en cualquier host: la plataforma y cada tienda (<tienda>.<dominio>) son la misma app
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    #Los assets llevan hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    #Rutas de React Router (BrowserRouter): todo lo que no es un archivo va a index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
